name: release

# Pushing a tag vX.Y.Z builds the release (.github/build.sh), installs
# and tries the Debian package in a new debian:13 container that has
# only the package (.github/try.sh), and publishes on a GitHub release:
#
#   dnsinfo_<version>_<arch>.deb            the package our servers install
#   dnsinfo_<version>_linux_<arch>.tar.gz   the same binary without one
#   SHA256SUMS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the latest stable Go release, whatever it is on the day
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - run: go vet ./...
      - run: go test ./...
      - name: Build the binaries and the packages
        run: sh .github/build.sh "${GITHUB_REF_NAME#v}"
      - name: Install and try the package on a machine with nothing else
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src debian:13
          sh .github/try.sh "${GITHUB_REF_NAME#v}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
